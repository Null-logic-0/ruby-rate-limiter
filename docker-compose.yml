# Two API servers sharing one Redis:
#   A -> http://127.0.0.1:8080
#   B -> http://127.0.0.1:8081
#
#   docker compose up --build

x-api: &api
  build: .
  environment:
    REDIS_URL: redis://redis:6379/0
    RATE_LIMIT_ALGORITHM: sliding_window_counter
    RATE_LIMIT: "60"
    RATE_LIMIT_WINDOW: "60"
    RATE_LIMIT_REDIS_FAILURE: ${RATE_LIMIT_REDIS_FAILURE:-allow}
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "ruby",
        "-rnet/http",
        "-e",
        "exit Net::HTTP.get_response(URI('http://127.0.0.1:8080/unlimited')).is_a?(Net::HTTPSuccess)",
      ]
    interval: 5s
    timeout: 3s
    retries: 5
  restart: unless-stopped

services:
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api-a:
    <<: *api
    ports:
      - "127.0.0.1:8080:8080"

  api-b:
    <<: *api
    ports:
      - "127.0.0.1:8081:8080"
